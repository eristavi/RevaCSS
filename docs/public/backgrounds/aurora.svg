<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
<title>RevaCSS Aurora — glass material background</title>
<desc>Original abstract flowing colour fields with strong cyan, magenta and amber contrasts against deep ink. CSS colour variables are available when embedded inline.</desc>
<defs>
 <linearGradient id="a-base" x2="1" y2="1"><stop stop-color="var(--demo-art-0,#03091d)"/><stop offset=".52" stop-color="var(--demo-art-1,#10143a)"/><stop offset="1" stop-color="var(--demo-art-2,#050719)"/></linearGradient>
 <radialGradient id="a-cyan"><stop stop-color="var(--demo-art-3,#a4fff1)"/><stop offset=".23" stop-color="var(--demo-art-4,#11ede2)"/><stop offset=".53" stop-color="var(--demo-art-5,#008dba)"/><stop offset=".8" stop-color="var(--demo-art-6,#00416e)" stop-opacity=".7"/><stop offset="1" stop-color="var(--demo-art-6,#00416e)" stop-opacity="0"/></radialGradient>
 <radialGradient id="a-pink"><stop stop-color="var(--demo-art-7,#ff98ce)"/><stop offset=".24" stop-color="var(--demo-art-8,#ff167e)"/><stop offset=".55" stop-color="var(--demo-art-9,#ae087a)"/><stop offset=".8" stop-color="var(--demo-art-10,#580e73)" stop-opacity=".7"/><stop offset="1" stop-color="var(--demo-art-10,#580e73)" stop-opacity="0"/></radialGradient>
 <radialGradient id="a-gold"><stop stop-color="var(--demo-art-11,#fff0a4)"/><stop offset=".25" stop-color="var(--demo-art-12,#ffc33d)"/><stop offset=".53" stop-color="var(--demo-art-13,#ff601e)"/><stop offset=".79" stop-color="var(--demo-art-14,#ae2355)" stop-opacity=".75"/><stop offset="1" stop-color="var(--demo-art-14,#ae2355)" stop-opacity="0"/></radialGradient>
 <radialGradient id="a-violet"><stop stop-color="var(--demo-art-15,#ae8dff)"/><stop offset=".28" stop-color="var(--demo-art-16,#663af5)"/><stop offset=".65" stop-color="var(--demo-art-17,#252eb1)" stop-opacity=".7"/><stop offset="1" stop-color="var(--demo-art-17,#252eb1)" stop-opacity="0"/></radialGradient>
 <linearGradient id="a-ribbon" x1="0" y1="1" x2="1" y2="0"><stop stop-color="var(--demo-art-18,#10e2df)" stop-opacity="0"/><stop offset=".25" stop-color="var(--demo-art-19,#20fff0)" stop-opacity=".75"/><stop offset=".48" stop-color="var(--demo-art-20,#659aff)" stop-opacity=".28"/><stop offset=".72" stop-color="var(--demo-art-21,#ff308c)" stop-opacity=".75"/><stop offset="1" stop-color="var(--demo-art-22,#ffeab4)" stop-opacity=".9"/></linearGradient>
 <linearGradient id="a-edge" x1="0" y1="1" x2="1" y2="0"><stop stop-color="var(--demo-art-23,#21fff0)" stop-opacity="0"/><stop offset=".3" stop-color="var(--demo-art-24,#8dfff1)" stop-opacity=".8"/><stop offset=".65" stop-color="var(--demo-art-25,#ff52bc)" stop-opacity=".15"/><stop offset="1" stop-color="var(--demo-art-26,#fff2c6)" stop-opacity=".75"/></linearGradient>
</defs>
<rect width="1920" height="1080" fill="url(#a-base)"/>
<ellipse cx="1650" cy="95" rx="790" ry="650" fill="url(#a-gold)" transform="rotate(-22 1650 95)"/>
<ellipse cx="1100" cy="360" rx="690" ry="590" fill="url(#a-pink)" transform="rotate(-26 1100 360)"/>
<ellipse cx="1570" cy="950" rx="630" ry="540" fill="url(#a-violet)"/>
<ellipse cx="250" cy="720" rx="760" ry="580" fill="url(#a-cyan)" transform="rotate(-32 250 720)"/>
<ellipse cx="600" cy="1050" rx="560" ry="390" fill="url(#a-violet)" opacity=".75"/>
<path d="M-100 1010C260 1250 545 700 835 675S1120 960 1410 640 1680 210 2030 225L2030 305C1710 295 1720 580 1430 760S1100 860 825 785 260 1180-100 1110Z" fill="url(#a-ribbon)"/>
<path d="M-100 1010C260 1250 545 700 835 675S1120 960 1410 640 1680 210 2030 225" fill="none" stroke="url(#a-edge)" stroke-width="2"/>
<path d="M-120 130C350-230 470 410 840 255S1360-175 2030 140" fill="none" stroke="url(#a-edge)" stroke-width="95" opacity=".14"/>
</svg>
