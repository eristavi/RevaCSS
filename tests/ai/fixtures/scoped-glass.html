<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Embedded project cards</title>
<link rel="stylesheet" href="../../../dist/reva.scoped.css"><link rel="stylesheet" href="../../../dist/reva.glass.scoped.css"></head>
<body><p id="host-content">Existing host content outside the RevaCSS boundary.</p>
<main class="reva" data-theme="auto" data-material="glass">
  <div class="container stack"><h1>Project cards</h1>
    <article class="card"><h2>Inherited Glass</h2><p>This surface uses the scoped extension.</p></article>
    <article class="card" data-material="solid"><h2>Local Solid</h2><p>This card resets only its material.</p></article>
  </div>
</main></body></html>
