name: Focused WebKit release checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webkit:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[webkit preflight]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run clean
      - run: npm run build
        env:
          REVA_BASE: /
      - name: Use Ubuntu archive for browser dependencies
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          paths = [Path('/etc/apt/apt-mirrors.txt'), Path('/etc/apt/sources.list'), *Path('/etc/apt/sources.list.d').glob('*.list'), *Path('/etc/apt/sources.list.d').glob('*.sources')]
          for path in paths:
              if path.is_file():
                  source = path.read_text()
                  updated = source.replace('http://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu').replace('https://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
                  if updated != source:
                      path.write_text(updated)
                      print(f'Updated Ubuntu mirror in {path}')
          Path('/etc/apt/apt.conf.d/99reva-ci-timeouts').write_text('Acquire::Retries "1";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n')
          import subprocess
          config = subprocess.check_output(['apt-config', 'dump'], text=True)
          for setting in ['Acquire::Retries "1";', 'Acquire::http::Timeout "15";', 'Acquire::https::Timeout "15";']:
              assert setting in config, f'APT setting not effective: {setting}'
          print('Verified bounded APT download settings.')
          PY
      - run: npx playwright install --with-deps webkit
      - name: Recheck the five reported failures
        run: npm run test:browser -- tests/browser/button-materials.spec.mjs tests/browser/code-viewer.spec.mjs tests/browser/documentation-menu.spec.mjs --project=webkit --grep 'CSS-only customizer|navbar inheritance example|theme choices update' --reporter=list,json --trace=retain-on-failure
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: artifacts/browser-webkit-preflight.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: revacss-1.2.1-webkit-preflight
          path: |
            artifacts/browser-webkit-preflight.json
            test-results/
          if-no-files-found: warn
          retention-days: 14
