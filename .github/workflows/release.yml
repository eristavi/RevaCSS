name: Validate and publish RevaCSS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a new immutable GitHub release after every gate passes
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: revacss-release-${{ github.ref }}
  # A routine source push must not interrupt an explicitly requested release.
  cancel-in-progress: false

jobs:
  unit:
    name: Unit, project paths and quality gates
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]') || contains(github.event.head_commit.message, '[prepare release]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Confirm release metadata
        id: metadata
        run: node scripts/release-metadata.mjs
      - run: npm ci
      - name: Audit build dependencies
        run: npm audit --audit-level=high
      - run: npm run clean
      - run: npm run build
        env:
          REVA_BASE: /
      - run: npm test
      - run: npm run check:release-quality
      - run: npm run check:release-quality -- --npm
      - name: Check GitHub Pages project paths
        run: npm run build:docs && npm test
        env:
          REVA_SITE: https://eristavi.github.io
          REVA_BASE: /RevaCSS/
      - name: Report core size
        run: node --input-type=module -e "import {readFileSync} from 'node:fs'; import {gzipSync} from 'node:zlib'; console.log('Core gzip bytes:',gzipSync(readFileSync('dist/reva.min.css')).length);"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.metadata.outputs.package }}-${{ steps.metadata.outputs.version }}-canonical-css
          path: |
            dist/*.css
            docs/public/reva/*.css
            docs/src/pages/generated-reference.json
            package-lock.json
          if-no-files-found: error
          retention-days: 14

  browsers:
    name: Complete browser suite (${{ matrix.browser }})
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]') || contains(github.event.head_commit.message, '[prepare release]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Confirm release metadata
        id: metadata
        run: node scripts/release-metadata.mjs
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run clean
      - run: npm run build
        env:
          REVA_BASE: /
      - name: Use Ubuntu archive for browser dependencies
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          paths = [Path('/etc/apt/apt-mirrors.txt'), Path('/etc/apt/sources.list'), *Path('/etc/apt/sources.list.d').glob('*.list'), *Path('/etc/apt/sources.list.d').glob('*.sources')]
          for path in paths:
              if path.is_file():
                  source = path.read_text()
                  updated = source.replace('http://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu').replace('https://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
                  if updated != source:
                      path.write_text(updated)
                      print(f'Updated Ubuntu mirror in {path}')
          Path('/etc/apt/apt.conf.d/99reva-ci-timeouts').write_text('Acquire::Retries "1";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n')
          import subprocess
          config = subprocess.check_output(['apt-config', 'dump'], text=True)
          for setting in ['Acquire::Retries "1";', 'Acquire::http::Timeout "15";', 'Acquire::https::Timeout "15";']:
              assert setting in config, f'APT setting not effective: {setting}'
          print('Verified bounded APT download settings.')
          PY
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run every browser spec
        run: npm run test:browser -- --project=${{ matrix.browser }} --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: artifacts/browser-${{ matrix.browser }}.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: ${{ steps.metadata.outputs.package }}-${{ steps.metadata.outputs.version }}-${{ matrix.browser }}-results
          path: |
            artifacts/browser-${{ matrix.browser }}.json
            test-results/
          if-no-files-found: warn
          retention-days: 14

  adapters:
    name: Stable adapter archives and Composer installation
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]') || contains(github.event.head_commit.message, '[prepare release]')
    uses: ./.github/workflows/adapter-packages.yml

  package:
    name: Installed package and three-engine consumers
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]') || contains(github.event.head_commit.message, '[prepare release]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Confirm release metadata
        id: metadata
        run: node scripts/release-metadata.mjs
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:package
      - name: Use Ubuntu archive for browser dependencies
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          paths = [Path('/etc/apt/apt-mirrors.txt'), Path('/etc/apt/sources.list'), *Path('/etc/apt/sources.list.d').glob('*.list'), *Path('/etc/apt/sources.list.d').glob('*.sources')]
          for path in paths:
              if path.is_file():
                  source = path.read_text()
                  updated = source.replace('http://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu').replace('https://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
                  if updated != source:
                      path.write_text(updated)
                      print(f'Updated Ubuntu mirror in {path}')
          Path('/etc/apt/apt.conf.d/99reva-ci-timeouts').write_text('Acquire::Retries "1";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n')
          import subprocess
          config = subprocess.check_output(['apt-config', 'dump'], text=True)
          for setting in ['Acquire::Retries "1";', 'Acquire::http::Timeout "15";', 'Acquire::https::Timeout "15";']:
              assert setting in config, f'APT setting not effective: {setting}'
          print('Verified bounded APT download settings.')
          PY
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:package:browser

  release:
    name: Publish validated versioned downloads
    needs: [unit, browsers, package, adapters]
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Confirm release metadata
        id: metadata
        run: node scripts/release-metadata.mjs
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run clean
      - run: npm run build
      - run: npm run check:release-quality
      - run: npm run check:release-quality -- --npm
      - name: Verify committed generated assets
        run: git diff --exit-code -- dist docs/public/reva docs/src/pages/generated-reference.json
      - name: Install React packaging compiler
        run: npm --prefix integrations/react ci --ignore-scripts --legacy-peer-deps
      - name: Prepare and verify archives
        env:
          PACKAGE_TARBALL: ${{ steps.metadata.outputs.tarball_name }}
        run: |
          python3 scripts/package-release.py
          npm pack --pack-destination artifacts
          node scripts/package-integrations.mjs artifacts
          cd artifacts
          sha256sum "$PACKAGE_TARBALL" >> SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish immutable GitHub release
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_NAME: ${{ steps.metadata.outputs.release_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace published assets.'
            exit 1
          fi
          cp RELEASE_NOTES.md artifacts/release-notes.md
          printf '\nAutomated validation: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> artifacts/release-notes.md
          gh release create "$RELEASE_TAG" artifacts/*.zip artifacts/*.tar.gz artifacts/*.tgz artifacts/integration-packages.json artifacts/*.min.css artifacts/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "RevaCSS $RELEASE_VERSION — $RELEASE_NAME" --notes-file artifacts/release-notes.md
