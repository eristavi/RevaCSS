name: Build and deploy documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
  workflow_run:
    workflows: [Publish verified npm releases]
    types: [completed]
  # Refresh registry availability after a maintainer publishes npm manually.
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

concurrency:
  group: reva-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages-build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - run: npm ci
      - name: Verify current GitHub and npm publication status
        run: node scripts/docs-publication-status.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run clean
      - run: npm run build
        env:
          REVA_SITE: ${{ steps.pages.outputs.origin }}
          REVA_BASE: ${{ steps.pages.outputs.base_path }}/
      - name: Check all generated documentation links
        # Maintainer-requested deferred changes still build and deploy the docs.
        if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip tests]')
        run: node --test tests/docs-links.test.mjs
        env:
          REVA_BASE: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs/dist

  pages-deploy:
    needs: pages-build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4


