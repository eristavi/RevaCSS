name: Requested browser regression checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      scope:
        description: Validation scope
        type: choice
        options: [full, documentation, code-viewer]
        default: full

permissions:
  contents: read

concurrency:
  # Requested candidate revisions are independent; keep their evidence rather
  # than cancelling a slower engine when a correction is pushed.
  group: reva-tests-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    # Ordinary PRs do not start browser tests. This marker is an explicit opt-in.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.title, '[validate release]') || contains(github.event.pull_request.title, '[validate code viewer]')
    name: Validate (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(contains(github.event.pull_request.title, '[webkit]') && '["webkit"]' || '["chromium","firefox","webkit"]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run clean
      - run: npm run build
        env:
          REVA_BASE: /
      - run: npm test
      - name: Use Ubuntu archive for browser dependencies
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          paths = [Path('/etc/apt/apt-mirrors.txt'), Path('/etc/apt/sources.list'), *Path('/etc/apt/sources.list.d').glob('*.list'), *Path('/etc/apt/sources.list.d').glob('*.sources')]
          for path in paths:
              if path.is_file():
                  source = path.read_text()
                  updated = source.replace('http://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu').replace('https://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
                  if updated != source:
                      path.write_text(updated)
                      print(f'Updated Ubuntu mirror in {path}')
          Path('/etc/apt/apt.conf.d/99reva-ci-timeouts').write_text('Acquire::Retries "1";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n')
          import subprocess
          config = subprocess.check_output(['apt-config', 'dump'], text=True)
          for setting in ['Acquire::Retries "1";', 'Acquire::http::Timeout "15";', 'Acquire::https::Timeout "15";']:
              assert setting in config, f'APT setting not effective: {setting}'
          print('Verified bounded APT download settings.')
          PY
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run the selected browser checks
        run: |
          if [ "$VALIDATION_SCOPE" = "documentation" ]; then
            npx playwright test tests/browser/documentation.spec.mjs tests/browser/documentation-menu.spec.mjs tests/browser/device-checks.spec.mjs tests/browser/navbar.spec.mjs tests/browser/code-viewer.spec.mjs tests/browser/native-patterns.spec.mjs tests/browser/dashboard.spec.mjs tests/browser/shop.spec.mjs --project=${{ matrix.browser }}
          elif [ "$VALIDATION_SCOPE" = "code-viewer" ]; then
            npx playwright test tests/browser/code-viewer.spec.mjs --project=${{ matrix.browser }} --workers=2 --reporter=list,json
          else
            npm run test:browser -- --project=${{ matrix.browser }} --workers=2 --reporter=list,json
          fi
        env:
          VALIDATION_SCOPE: ${{ contains(github.event.pull_request.title, '[validate code viewer]') && 'code-viewer' || inputs.scope }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: artifacts/browser-${{ matrix.browser }}.json
      - name: Verify installed package in this engine
        run: npm run test:package:browser
        env:
          REVA_TEST_ENGINE: ${{ matrix.browser }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: requested-browser-${{ matrix.browser }}
          path: |
            artifacts/browser-${{ matrix.browser }}.json
            test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Report recorded release quality
        run: |
          if npm run check:release-quality > quality-status.txt 2>&1; then
            cat quality-status.txt
            echo 'Recorded release-quality blockers: resolved. Other release gates still apply.' >> "$GITHUB_STEP_SUMMARY"
          else
            cat quality-status.txt
            echo 'Release quality: BLOCKED. Expected failures are not acceptance passes; npm publication remains on hold.' >> "$GITHUB_STEP_SUMMARY"
            cat quality-status.txt >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check GitHub Pages project paths
        run: npm run build:docs && npm test
        env:
          REVA_SITE: https://eristavi.github.io
          REVA_BASE: /RevaCSS/

