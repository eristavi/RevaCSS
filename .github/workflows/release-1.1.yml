name: Publish verified RevaCSS 1.1 downloads

on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/release-1.1.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: revacss-release-1.1.0
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Confirm matching package version
        run: |
          node --input-type=module -e "import p from './package.json' with {type:'json'}; import l from './package-lock.json' with {type:'json'}; if(p.version!=='1.1.0'||l.version!==p.version||l.packages[''].version!==p.version) process.exit(1)"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:package
      - run: npm run check:release-quality
      - run: npm run check:release-quality -- --npm
      - name: Prepare and verify archives
        run: |
          python3 scripts/package-release.py
          npm pack --pack-destination artifacts
          cd artifacts
          sha256sum --check SHA256SUMS.txt
      - name: Publish immutable versioned GitHub release
        run: |
          if gh release view v1.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace published assets.'
            exit 1
          fi
          gh release create v1.1.0 artifacts/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'RevaCSS 1.1.0 — Erisian' --notes-file RELEASE_NOTES.md
